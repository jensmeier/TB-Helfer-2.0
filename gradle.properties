# ---------------------------------------------------------------------------
# Gradle Performance / Stability (AGP 9 + Gradle 9.1)
# ---------------------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache speeds up subsequent builds a lot.
# Keep problems as warnings to avoid "hard blocks" while plugins adapt.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Moderate memory default (adjust if you want: -Xmx4g etc.)
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# AndroidX (explicit, avoids edge cases in AAR metadata checks)
android.useAndroidX=true

# Show all warnings in CI/IDE
org.gradle.warning.mode=all

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
