name: Android APK packaging

on:
  push:
    branches: ["feature/tb-android-2.0"]
    paths: [".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify previously validated Android source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git diff --exit-code 5291d522a5cb7a8826d7d9190545ed3005d04b12 HEAD -- app gradle gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties
          test "$(gh api repos/jensmeier/TB-Helfer-2.0/actions/runs/41498293472 --jq .head_sha)" = "5291d522a5cb7a8826d7d9190545ed3005d04b12"
          test "$(gh api repos/jensmeier/TB-Helfer-2.0/actions/jobs/125458915143 --jq .conclusion)" = "success"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/wrapper-validation-action@v2
      - name: Build requested debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain
      - name: Verify APK and pair release companion
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, re, shutil, subprocess
          from pathlib import Path
          source = Path("app/build.gradle.kts").read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
          build = re.search(r'versionCode\s*=\s*(\d+)', source).group(1)
          assert (version, build) == ("1.3.35", "200085")
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size > 0
          sdk = Path(os.environ["ANDROID_HOME"])
          analyzer = sdk / "cmdline-tools/latest/bin/apkanalyzer"
          assert analyzer.is_file()
          def manifest(key):
              return subprocess.check_output([str(analyzer), "manifest", key, str(apk)], text=True).strip()
          assert manifest("application-id") == "de.tbhelfer"
          assert manifest("version-name") == version
          assert manifest("version-code") == build
          tools = sorted((sdk / "build-tools").glob("*/apksigner"), key=lambda p: tuple(int(x) for x in re.findall(r"\d+", p.parent.name)))
          assert tools
          signature = subprocess.check_output([str(tools[-1]), "verify", "--verbose", "--print-certs", str(apk)], text=True)
          md = Path(f"projektsteuerung/releases/TB-Helfer_{version}_{build}.md")
          release = md.read_text()
          for value in ["TB-HELFER-RELEASE", "PLATTFORM: ANDROID", f"VERSION: {version}", f"BUILD: {build}", "MINIMUM_BUILD:", "PFLICHTUPDATE:", "DOWNLOAD_URL:"]:
              assert value in release, value
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          delivery = Path("apk-delivery")
          delivery.mkdir()
          stem = f"TB-Helfer_{version}_{build}"
          shutil.copyfile(apk, delivery / (stem + ".apk"))
          evidence = f"\n\nAPK-PRUEFUNG DIESES BUILDS:\nVARIANTE: DEBUG\nBAU_COMMIT: {os.environ['GITHUB_SHA']}\nAPK_SHA256: {digest}\nAPK_BYTES: {apk.stat().st_size}\nMANIFEST: de.tbhelfer / {version} / {build}\n"
          evidence += "UPDATEKOMPATIBILITAET: Zertifikat der installierten App nicht verglichen; bei Signaturabweichung nicht deinstallieren.\nSIGNATURPRUEFUNG:\n" + signature
          (delivery / (stem + ".md")).write_text(release + evidence)
          print(evidence)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TB-Helfer-1.3.35-200085
          path: apk-delivery/*
          if-no-files-found: error
          retention-days: 14
