name: Android Room migration and atomic receive tests
on:
  push:
    branches: [ "feature/tb-android-2.0" ]
    paths:
      - "app/src/androidTest/java/de/tbhelfer/datenbank/TrackJournalMigrationTest.kt"
      - ".github/workflows/android-room.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-room-${{ github.ref }}
  cancel-in-progress: true
jobs:
  room:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Verify migration and transaction rollback on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.tbhelfer.datenbank.TrackJournalMigrationTest --no-daemon --stacktrace
      - name: Preserve instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-migration-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
