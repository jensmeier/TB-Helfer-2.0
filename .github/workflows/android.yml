name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug + Release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare installable Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TB-Helfer-debug.apk

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v7
        with:
          path: TB-Helfer-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
