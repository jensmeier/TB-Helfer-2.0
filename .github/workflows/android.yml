name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Apply Kilometrierung v1 integration patch
        if: github.event_name == 'pull_request' && github.head_ref == 'kilometrierung-v1'
        run: |
          python3 .github/scripts/apply_km_v1_patch.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/de/tbhelfer/datenbank/TrassenRepository.kt
            git add app/src/main/java/de/tbhelfer/ui/importexport/ImportExportFragment.kt
            git add app/src/main/java/de/tbhelfer/ui/importexport/TrassenGrafikView.kt
            git commit -m "Kilometrierung: Status und Gueltigkeitsbereich vereinheitlichen"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug + Release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Lint Debug
        run: ./gradlew :app:lintDebug --stacktrace
