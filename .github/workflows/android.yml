name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "server/checks/0*.py"
      - "server/checks/1*.py"
      - "server/checks/83_verify_android_staging_server_config_source.py"
      - "server/checks/84_verify_device_activation_qr_source.py"
      - "server/checks/85_verify_android_200052_compile_imports.py"
      - "server/checks/86_verify_android_update_client_source.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "server/checks/0*.py"
      - "server/checks/1*.py"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify server/source contracts
        run: |
          python3 server/checks/03_verify_schema10_source.py
          python3 server/checks/04_test_team_btb_merge.py
          python3 server/checks/12_verify_schema12_source.py
          python3 server/checks/13_verify_android_btb_auto_sync_source.py
          python3 server/checks/14_verify_android_btb_sections_logo_source.py
          python3 server/checks/15_verify_android_btb_delete_lifecycle_source.py
          python3 server/checks/17_verify_schema13_source.py
          python3 server/checks/18_verify_android_worksite_structure_source.py
          python3 server/checks/19_verify_schema13_track_delete_source.py
          python3 server/checks/83_verify_android_staging_server_config_source.py
          python3 server/checks/84_verify_device_activation_qr_source.py
          python3 server/checks/85_verify_android_200052_compile_imports.py
          python3 server/checks/86_verify_android_update_client_source.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Unit tests + Build Debug + Release
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Lint (Debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload Android 200063 package
        uses: actions/upload-artifact@v4
        with:
          name: TB-Helfer-1.3.13-200063
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            releases/TB-Helfer_1.3.13_200063.md
