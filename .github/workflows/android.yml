name: Android CI

on:
  push:
    branches: [ "main", "master", "feature/tb-android-2.0" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "server/checks/0*.py"
      - "server/checks/1*.py"
      - "server/checks/8[3-6]*.py"
      - "projektsteuerung/releases/TB-Helfer_*.md"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source_contracts:
    name: Server and Android source contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify all server/source contracts
        shell: bash
        run: |
          contract_failed=0
          for contract_check in \
            server/checks/03_verify_schema10_source.py \
            server/checks/04_test_team_btb_merge.py \
            server/checks/12_verify_schema12_source.py \
            server/checks/13_verify_android_btb_auto_sync_source.py \
            server/checks/14_verify_android_btb_sections_logo_source.py \
            server/checks/15_verify_android_btb_delete_lifecycle_source.py \
            server/checks/17_verify_schema13_source.py \
            server/checks/18_verify_android_worksite_structure_source.py \
            server/checks/19_verify_schema13_track_delete_source.py \
            server/checks/83_verify_android_staging_server_config_source.py \
            server/checks/84_verify_device_activation_qr_source.py \
            server/checks/85_verify_android_200052_compile_imports.py \
            server/checks/86_verify_android_update_client_source.py
          do
            if ! python3 "$contract_check"; then
              contract_failed=1
            fi
          done
          exit "$contract_failed"

  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android release companion file
        id: release_meta
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          version_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          build_match = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          if not version_match or not build_match:
              raise SystemExit("versionName/versionCode not found in app/build.gradle.kts")

          version = version_match.group(1)
          build = build_match.group(1)
          release_path = Path(f"projektsteuerung/releases/TB-Helfer_{version}_{build}.md")
          if not release_path.is_file():
              raise SystemExit(f"Missing Android release companion file: {release_path}")

          text = release_path.read_text(encoding="utf-8")
          required = [
              "TB-HELFER-RELEASE",
              "PLATTFORM: ANDROID",
              f"VERSION: {version}",
              f"BUILD: {build}",
              "MINIMUM_BUILD:",
              "PFLICHTUPDATE:",
              "DOWNLOAD_URL:",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit("Release companion file mismatch: " + ", ".join(missing))

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as out:
              out.write(f"release_file={release_path.as_posix()}\n")
              out.write(f"artifact_name=TB-Helfer-{version}-{build}\n")
          print(f"OK {release_path} matches Android {version} / {build}")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Gradle bootstrap
        timeout-minutes: 5
        run: ./gradlew --version --console=plain

      - name: Unit tests (no APK)
        timeout-minutes: 20
        run: ./gradlew :app:testDebugUnitTest --continue --stacktrace --console=plain

      - name: Lint (Debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*

      - name: Build explicitly requested APK
        if: contains(github.event.head_commit.message, '[apk]')
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Verify APK and pair release companion
        if: contains(github.event.head_commit.message, '[apk]')
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, re, shutil, subprocess
          from pathlib import Path
          source = Path("app/build.gradle.kts").read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
          build = re.search(r'versionCode\s*=\s*(\d+)', source).group(1)
          assert (version, build) == ("1.3.38", "200088")
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size > 0
          sdk = Path(os.environ["ANDROID_HOME"])
          analyzer = sdk / "cmdline-tools/latest/bin/apkanalyzer"
          assert analyzer.is_file()
          def manifest(key):
              return subprocess.check_output([str(analyzer), "manifest", key, str(apk)], text=True).strip()
          assert manifest("application-id") == "de.tbhelfer"
          assert manifest("version-name") == version
          assert manifest("version-code") == build
          tools = sorted((sdk / "build-tools").glob("*/apksigner"), key=lambda p: tuple(int(x) for x in re.findall(r"\d+", p.parent.name)))
          assert tools
          signature = subprocess.check_output([str(tools[-1]), "verify", "--verbose", "--print-certs", str(apk)], text=True)
          md = Path(f"projektsteuerung/releases/TB-Helfer_{version}_{build}.md")
          release = md.read_text()
          for value in ["TB-HELFER-RELEASE", "PLATTFORM: ANDROID", f"VERSION: {version}", f"BUILD: {build}", "MINIMUM_BUILD:", "PFLICHTUPDATE:", "DOWNLOAD_URL:"]:
              assert value in release, value
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          delivery = Path("apk-delivery")
          delivery.mkdir()
          stem = f"TB-Helfer_{version}_{build}"
          shutil.copyfile(apk, delivery / (stem + ".apk"))
          evidence = f"\n\nAPK-PRUEFUNG DIESES BUILDS:\nVARIANTE: DEBUG\nBAU_COMMIT: {os.environ['GITHUB_SHA']}\nAPK_SHA256: {digest}\nAPK_BYTES: {apk.stat().st_size}\nMANIFEST: de.tbhelfer / {version} / {build}\n"
          evidence += "UPDATEKOMPATIBILITAET: Zertifikat der installierten App nicht verglichen; bei Signaturabweichung nicht deinstallieren.\nSIGNATURPRUEFUNG:\n" + signature
          (delivery / (stem + ".md")).write_text(release + evidence)
          print(evidence)
          PY

      - name: Upload requested APK with matching release file
        if: contains(github.event.head_commit.message, '[apk]')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_meta.outputs.artifact_name }}
          path: apk-delivery/*
          if-no-files-found: error
          retention-days: 14


