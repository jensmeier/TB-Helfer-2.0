name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

# Internal 004 migration retry; removed again after the patch is committed.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Apply TB-Helfer 2.0 (004) patch
        run: |
          if grep -q 'versionCode = 200003' app/build.gradle.kts; then
            python .github/scripts/apply_004.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts VERSION_HISTORY.md \
              app/src/main/java/de/tbhelfer/streckenobjekte/StreckenObjektSpeicher.kt \
              app/src/main/java/de/tbhelfer/ui/baustelle/BaustelleNeuFragment.kt \
              app/src/main/java/de/tbhelfer/ui/importexport/ImportExportFragment.kt \
              app/src/main/java/de/tbhelfer/ui/importexport/TrassenGrafikView.kt
            git commit -m "TB-Helfer 2.0 (004): Weichen und DKW dauerhaft darstellen"
            git push origin HEAD:kilometrierung-v1
          else
            echo "004 patch already applied"
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug + Release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare installable Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TB-Helfer-debug.apk

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v7
        with:
          path: TB-Helfer-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
