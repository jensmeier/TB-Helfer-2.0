name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Migrate graphical connection detection
        if: github.event_name == 'pull_request' && github.head_ref == 'kilometrierung-v1'
        run: |
          python3 .github/scripts/migrate_trassen_grafik_anschluss.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/de/tbhelfer/ui/importexport/TrassenGrafikView.kt
            git commit -m "Weichen/DKW: Grafik auf gemeinsame Anschlusslogik umstellen"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug + Release
        # assembleRelease fuehrt wegen checkReleaseBuilds=true bereits lintVitalRelease aus.
        # Ein zweiter kompletter lintDebug-Lauf ist im GitHub-Runner sehr langsam und redundant.
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
