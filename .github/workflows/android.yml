name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Apply TB-Helfer 2.0 (006) integration
        run: |
          python .github/scripts/apply_006_integration.py
          if git diff --quiet; then
            echo "006 integration already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/de/tbhelfer/ui/importexport/ImportExportFragment.kt
            git commit -m "TB-Helfer 2.0 (006): rohe KF direkt importieren"
            git push origin HEAD:kilometrierung-v1
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug + Release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare installable Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TB-Helfer-debug.apk

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v7
        with:
          path: TB-Helfer-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14