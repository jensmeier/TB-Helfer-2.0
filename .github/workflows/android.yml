name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply TB-Helfer 2.0 (002) graphical GVP patch
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/apply_v2002_graphical_gvp_patch.py
          python3 .github/scripts/apply_v2002_graphic_typen_fix.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/de/tbhelfer/ui/importexport/ImportExportFragment.kt \
                    app/src/main/java/de/tbhelfer/ui/importexport/TrassenGrafikView.kt \
                    app/src/main/java/de/tbhelfer/streckenobjekte/StreckenObjektSpeicher.kt
            git commit -m "TB-Helfer 2.0 (002): GVP direkt in Grafik zuordnen"
            git push
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug + Release
        # assembleRelease fuehrt wegen checkReleaseBuilds=true bereits lintVitalRelease aus.
        # Ein zweiter kompletter lintDebug-Lauf ist im GitHub-Runner sehr langsam und redundant.
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare installable Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TB-Helfer-debug.apk

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v7
        with:
          path: TB-Helfer-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
