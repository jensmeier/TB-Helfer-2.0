name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify server/source contracts
        run: |
          python3 server/checks/03_verify_schema10_source.py
          python3 server/checks/04_test_team_btb_merge.py
          python3 server/checks/12_verify_schema12_source.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Build Debug + Release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Lint (Debug)
        run: ./gradlew :app:lintDebug --stacktrace
