name: One-off Android 200043 entry photo fix

on:
  push:
    branches: [ "feature/admin-offline-sync" ]

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: ${{ !contains(github.event.head_commit.message, '[200043-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply targeted 200043 source fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/de/tbhelfer/ui/bautagebuch/BautagebuchFragment.kt')
          s = main.read_text(encoding='utf-8')

          old_buttons_anchor = '''                        tilText.addView(etText)\n                        root.addView(tilText)\n\n                        val firmTitle = firm ?: getString(R.string.btb_company_general)\n'''
          new_buttons_anchor = '''                        tilText.addView(etText)\n                        root.addView(tilText)\n\n                        // Android 200043: Fotoquelle dort anbieten, wo der Arbeitseintrag entsteht.\n                        // Die eigentliche Kamera-/Galerie-Logik bleibt im bestehenden\n                        // BtbPdfAuswahlFragment und wird nur mit dem neuen Zielkontext gestartet.\n                        val photoActionRow = android.widget.LinearLayout(requireContext()).apply {\n                            orientation = android.widget.LinearLayout.HORIZONTAL\n                            weightSum = 2f\n                            setPadding(0, dp(8), 0, 0)\n                            visibility = if (fotoType == de.tbhelfer.datenbank.Bildtyp.FOTODOKUMENTATION) {\n                                android.view.View.VISIBLE\n                            } else {\n                                android.view.View.GONE\n                            }\n                        }\n                        val btnEntryCamera = com.google.android.material.button.MaterialButton(requireContext()).apply {\n                            text = "📷 Kamera"\n                            isAllCaps = false\n                            textSize = 12f\n                            layoutParams = android.widget.LinearLayout.LayoutParams(0, android.view.ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {\n                                marginEnd = dp(4)\n                            }\n                        }\n                        val btnEntryGallery = com.google.android.material.button.MaterialButton(requireContext()).apply {\n                            text = "🖼 Galerie/Dateien"\n                            isAllCaps = false\n                            textSize = 12f\n                            layoutParams = android.widget.LinearLayout.LayoutParams(0, android.view.ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {\n                                marginStart = dp(4)\n                            }\n                        }\n                        photoActionRow.addView(btnEntryCamera)\n                        photoActionRow.addView(btnEntryGallery)\n                        root.addView(photoActionRow)\n\n                        val firmTitle = firm ?: getString(R.string.btb_company_general)\n'''
          if 'val btnEntryCamera = com.google.android.material.button.MaterialButton' not in s:
              if old_buttons_anchor not in s:
                  raise SystemExit('200043: button anchor not found')
              s = s.replace(old_buttons_anchor, new_buttons_anchor, 1)

          old_listener = '''                        dlg.setOnShowListener {\n                            val btn = dlg.getButton(android.content.DialogInterface.BUTTON_POSITIVE)\n                            btn.setOnClickListener {\n                                val txt = etText.text?.toString().orEmpty().trim()\n                                if (txt.isBlank()) return@setOnClickListener\n\n                                val tRaw = etTime.text?.toString().orEmpty().trim()\n                                val tNorm = if (tRaw.isBlank()) null else normalizeTimeOrSpan(tRaw)\n                                if (tRaw.isNotBlank() && tNorm == null) {\n                                    tilTime.error = getString(R.string.btb_entry_time_error)\n                                    return@setOnClickListener\n                                }\n                                tilTime.error = null\n\n                                val kmVonRaw = etKmVon.text?.toString().orEmpty().trim()\n                                val kmBisRaw = etKmBis.text?.toString().orEmpty().trim()\n                                val kmVon = parseKmValue(kmVonRaw)\n                                val kmBis = parseKmValue(kmBisRaw)\n                                if (kmVonRaw.isNotBlank() && kmVon == null) {\n                                    tilKmVon.error = "KM prüfen"\n                                    return@setOnClickListener\n                                }\n                                if (kmBisRaw.isNotBlank() && kmBis == null) {\n                                    tilKmBis.error = "KM prüfen"\n                                    return@setOnClickListener\n                                }\n                                tilKmVon.error = null\n                                tilKmBis.error = null\n\n                                val line = buildManualLine(selectedOrtMarkerId, firm, tNorm, txt, kmVon, kmBis)\n\n                                val curLines = etFull.text?.toString().orEmpty().lines().toMutableList()\n                                val base = if (curLines.size == 1 && curLines.first().isBlank()) mutableListOf<String>() else curLines\n                                val nextLines = (base + line).toMutableList()\n                                setRawLines(nextLines.filter { it.isNotBlank() })\n\n                                renderMerged?.invoke(lastGroups)\n                                dlg.dismiss()\n                            }\n                        }\n'''
          new_listener = '''                        data class ManualEntryDraft(\n                            val text: String,\n                            val time: String?,\n                            val kmVon: Double?,\n                            val kmBis: Double?,\n                            val ortId: Long,\n                            val ortLabel: String,\n                            val line: String\n                        )\n\n                        fun readManualEntryDraft(): ManualEntryDraft? {\n                            val txt = etText.text?.toString().orEmpty().trim()\n                            if (txt.isBlank()) {\n                                tilText.error = "Eintrag eingeben"\n                                return null\n                            }\n                            tilText.error = null\n\n                            val tRaw = etTime.text?.toString().orEmpty().trim()\n                            val tNorm = if (tRaw.isBlank()) null else normalizeTimeOrSpan(tRaw)\n                            if (tRaw.isNotBlank() && tNorm == null) {\n                                tilTime.error = getString(R.string.btb_entry_time_error)\n                                return null\n                            }\n                            tilTime.error = null\n\n                            val kmVonRaw = etKmVon.text?.toString().orEmpty().trim()\n                            val kmBisRaw = etKmBis.text?.toString().orEmpty().trim()\n                            val kmVon = parseKmValue(kmVonRaw)\n                            val kmBis = parseKmValue(kmBisRaw)\n                            if (kmVonRaw.isNotBlank() && kmVon == null) {\n                                tilKmVon.error = "KM prüfen"\n                                return null\n                            }\n                            if (kmBisRaw.isNotBlank() && kmBis == null) {\n                                tilKmBis.error = "KM prüfen"\n                                return null\n                            }\n                            tilKmVon.error = null\n                            tilKmBis.error = null\n\n                            val ortId = selectedOrtMarkerId\n                            return ManualEntryDraft(\n                                text = txt,\n                                time = tNorm,\n                                kmVon = kmVon,\n                                kmBis = kmBis,\n                                ortId = ortId,\n                                ortLabel = labelForOrtCached(ortId),\n                                line = buildManualLine(ortId, firm, tNorm, txt, kmVon, kmBis)\n                            )\n                        }\n\n                        fun appendManualEntry(draft: ManualEntryDraft) {\n                            val curLines = etFull.text?.toString().orEmpty().lines().toMutableList()\n                            val base = if (curLines.size == 1 && curLines.first().isBlank()) mutableListOf<String>() else curLines\n                            setRawLines((base + draft.line).filter { it.isNotBlank() })\n                            renderMerged?.invoke(lastGroups)\n                        }\n\n                        fun launchPhotoForEntry(draft: ManualEntryDraft, source: String) {\n                            appendManualEntry(draft)\n                            // Anders als beim normalen "Hinzufügen" wird der Abschnitt vor dem\n                            // Kamera-/Galerie-Wechsel gespeichert, damit der Arbeitseintrag beim\n                            // Zurückkehren bereits zum gleichen BTB gehört.\n                            onSave(etFull.text?.toString().orEmpty())\n                            dlg.dismiss()\n                            dialog.dismiss()\n                            saveAndReloadWholeBtbSilently()\n\n                            viewLifecycleOwner.lifecycleScope.launch {\n                                val currentCtx = resolveAktuelleBaustelle() ?: return@launch\n                                val entry = buildEntry(currentCtx)\n                                val args = android.os.Bundle().apply {\n                                    putLong("baustelleId", entry.baustelleId)\n                                    putString("baustelleName", entry.baustelleName)\n                                    putString("datumIso", entry.datumIso)\n                                    putString("shiftStart", entry.startUhrzeit)\n                                    putString("shiftEnd", entry.endeUhrzeit)\n                                    putString("schichtTyp", selectedSchichtTyp.name)\n                                    putString("filterBildtyp", de.tbhelfer.datenbank.Bildtyp.FOTODOKUMENTATION.name)\n                                    putString("btbId", entry.btbId)\n                                    putString("autoPhotoSource", source)\n                                    putString("autoPhotoFirma", firm)\n                                    putLong("autoPhotoOrtId", draft.ortId)\n                                    putString("autoPhotoOrtLabel", draft.ortLabel)\n                                    putString("autoPhotoText", draft.text)\n                                    putString("autoPhotoTime", draft.time)\n                                    draft.kmVon?.let { putDouble("autoPhotoKmVon", it) }\n                                    draft.kmBis?.let { putDouble("autoPhotoKmBis", it) }\n                                }\n                                findNavController().navigate(R.id.btbPdfAuswahlFragment, args)\n                            }\n                        }\n\n                        dlg.setOnShowListener {\n                            val btn = dlg.getButton(android.content.DialogInterface.BUTTON_POSITIVE)\n                            btn.setOnClickListener {\n                                val draft = readManualEntryDraft() ?: return@setOnClickListener\n                                appendManualEntry(draft)\n                                dlg.dismiss()\n                            }\n                            btnEntryCamera.setOnClickListener {\n                                val draft = readManualEntryDraft() ?: return@setOnClickListener\n                                launchPhotoForEntry(draft, "camera")\n                            }\n                            btnEntryGallery.setOnClickListener {\n                                val draft = readManualEntryDraft() ?: return@setOnClickListener\n                                launchPhotoForEntry(draft, "gallery")\n                            }\n                        }\n'''
          if 'fun launchPhotoForEntry(draft: ManualEntryDraft' not in s:
              if old_listener not in s:
                  raise SystemExit('200043: listener anchor not found')
              s = s.replace(old_listener, new_listener, 1)

          main.write_text(s, encoding='utf-8')

          pdf = Path('app/src/main/java/de/tbhelfer/ui/bautagebuch/BtbPdfAuswahlFragment.kt')
          p = pdf.read_text(encoding='utf-8')
          old_state = '''    private var pendingImportTarget: ImportTarget? = null\n\n    // Android 200042: Ein kompaktes Kamera-Symbol pro Arbeitseintrag startet entweder\n'''
          new_state = '''    private var pendingImportTarget: ImportTarget? = null\n    private var autoPhotoSourceConsumed: Boolean = false\n\n    // Android 200042: Ein kompaktes Kamera-Symbol pro Arbeitseintrag startet entweder\n'''
          if 'autoPhotoSourceConsumed' not in p:
              if old_state not in p:
                  raise SystemExit('200043: pdf state anchor not found')
              p = p.replace(old_state, new_state, 1)

          old_active = '''            val activeBtbId = withContext(Dispatchers.IO) {\n                BtbPhotoInstanzKey.activeBtbId(\n                    appContext,\n                    baustelleIdArg,\n                    datumIsoArg,\n                    schichtTypArg\n                ) ?: fallbackEntry?.btbId\n            }\n'''
          new_active = '''            val requestedBtbId = args.getString("btbId")?.trim()?.takeIf { it.isNotBlank() }\n            val activeBtbId = requestedBtbId ?: withContext(Dispatchers.IO) {\n                BtbPhotoInstanzKey.activeBtbId(\n                    appContext,\n                    baustelleIdArg,\n                    datumIsoArg,\n                    schichtTypArg\n                ) ?: fallbackEntry?.btbId\n            }\n'''
          if 'val requestedBtbId = args.getString("btbId")' not in p:
              if old_active not in p:
                  raise SystemExit('200043: active id anchor not found')
              p = p.replace(old_active, new_active, 1)

          old_render = '''            currentBlocks = blocks\n            render(currentBlocks)\n        }\n    }\n\n    override fun onResume() {\n'''
          new_render = '''            currentBlocks = blocks\n            render(currentBlocks)\n\n            // Android 200043: Wird die Fotoauswahl direkt aus dem Dialog\n            // "Eintrag für <Firma>" geöffnet, die gewählte Quelle genau einmal starten.\n            if (!autoPhotoSourceConsumed) {\n                val source = args.getString("autoPhotoSource")?.trim()?.lowercase()\n                    ?.takeIf { it == "camera" || it == "gallery" }\n                if (source != null) {\n                    autoPhotoSourceConsumed = true\n                    val ortId = args.getLong("autoPhotoOrtId", 0L)\n                    val target = ImportTarget(\n                        bildtyp = args.getString("filterBildtyp")\n                            ?.let { runCatching { Bildtyp.valueOf(it) }.getOrNull() }\n                            ?: Bildtyp.FOTODOKUMENTATION,\n                        firma = args.getString("autoPhotoFirma")?.trim()?.takeIf { it.isNotBlank() },\n                        ortId = ortId,\n                        ortLabel = args.getString("autoPhotoOrtLabel")?.trim()?.takeIf { it.isNotBlank() }\n                            ?: ortLabels[ortId]\n                            ?: if (ortId == 0L) "Hauptbaustelle" else "Ort $ortId",\n                        text = args.getString("autoPhotoText").orEmpty().trim(),\n                        time = args.getString("autoPhotoTime")?.trim()?.takeIf { it.isNotBlank() },\n                        kmVon = if (args.containsKey("autoPhotoKmVon")) args.getDouble("autoPhotoKmVon") else null,\n                        kmBis = if (args.containsKey("autoPhotoKmBis")) args.getDouble("autoPhotoKmBis") else null\n                    )\n                    if (target.text.isBlank()) {\n                        Snackbar.make(requireView(), "Arbeitseintrag für Foto fehlt", Snackbar.LENGTH_LONG).show()\n                    } else if (source == "camera") {\n                        launchCameraForTarget(target)\n                    } else {\n                        launchPhotoImport(target)\n                    }\n                }\n            }\n        }\n    }\n\n    override fun onResume() {\n'''
          if 'Wird die Fotoauswahl direkt aus dem Dialog' not in p:
              if old_render not in p:
                  raise SystemExit('200043: render anchor not found')
              p = p.replace(old_render, new_render, 1)

          old_camera_override = '''                BtbPhotoTextOverrideStore.setOverrideForIds(\n                    appContext, baustelleIdArg, datumIsoArg, shiftStartArg, shiftEndArg,\n                    schichtTypArg, ids, target.text\n                )\n                target.kmVon?.let { kmVon ->\n'''
          new_camera_override = '''                BtbPhotoTextOverrideStore.setOverrideForIds(\n                    appContext, baustelleIdArg, datumIsoArg, shiftStartArg, shiftEndArg,\n                    schichtTypArg, ids, target.text\n                )\n                target.time?.takeIf { it.isNotBlank() }?.let { time ->\n                    BtbPhotoStartOverrideStore.setOverrideForIds(\n                        appContext, baustelleIdArg, datumIsoArg, shiftStartArg, shiftEndArg,\n                        schichtTypArg, ids, time\n                    )\n                }\n                target.kmVon?.let { kmVon ->\n'''
          if 'target.time?.takeIf { it.isNotBlank() }?.let { time ->' not in p:
              if old_camera_override not in p:
                  raise SystemExit('200043: camera time anchor not found')
              p = p.replace(old_camera_override, new_camera_override, 1)

          pdf.write_text(p, encoding='utf-8')

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('// Android 200042: kompakte Arbeitseintrag-Fotoaktion mit Kamera oder Galerie/Dateien.\n        versionCode = 200042', '// Android 200043: Fotoquelle direkt im Arbeitseintrag-Dialog.\n        versionCode = 200043', 1)
          if 'versionCode = 200043' not in g:
              raise SystemExit('200043: version bump failed')
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Check diff
        run: git diff --check

      - name: Build Debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit tested fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/de/tbhelfer/ui/bautagebuch/BautagebuchFragment.kt \
            app/src/main/java/de/tbhelfer/ui/bautagebuch/BtbPdfAuswahlFragment.kt
          git commit -m "fix: show work-entry camera and gallery actions [200043-applied]"
          git push origin HEAD:feature/admin-offline-sync
