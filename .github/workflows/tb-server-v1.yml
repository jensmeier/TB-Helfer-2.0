          python server/checks/113_verify_survey_catalog_merge_logic.py
          python server/checks/114_verify_survey_staging_reset_source.py
          python server/checks/115_verify_survey_import_station_assignment_source.py
          python server/checks/116_verify_survey_diagnostics_portal_source.py

      # The normal migration runner includes the current 021 baseline.
      - name: Apply fresh TB-Server 1.0 baseline
        working-directory: server
        run: python -m tbserver.migrations up

      - name: Verify migration status
        working-directory: server
        run: |
          python -m tbserver.migrations status
          python - <<'PY'
          from tbserver.migrations import status
          current = status()
          assert current["latest_known"] == 21, current
          assert current["latest_applied"] == 21, current
          assert current["pending"] == [], current
          print("OK: migration status", current)
          PY

      - name: Verify core tables and migrations
        working-directory: server
        run: |
          python - <<'PY'
          from tbserver.database import connect
          required = {
              "companies", "users", "devices", "worksites", "worksite_nodes",
              "worksite_memberships", "teams", "btbs", "btb_entries", "files",
              "file_links", "upload_sessions", "defects", "acceptances",
              "survey_originals", "survey_parse_catalog", "track_data",
              "track_data_sources", "track_data_km_points", "mutation_receipts",
              "change_feed", "audit_log", "releases", "backup_runs",
              "system_metrics_hourly", "catalog_routes", "catalog_stations",
              "catalog_sections", "catalog_objects", "catalog_history",
              "system_schedule_runs", "btb_participant_states",
              "survey_catalog_assets", "survey_catalog_axes", "survey_catalog_segments",
              "survey_catalog_conflicts", "survey_catalog_history",
          }
          with connect() as conn, conn.cursor() as cur:
              cur.execute("SELECT tablename FROM pg_tables WHERE schemaname='tb'")
              tables = {row["tablename"] for row in cur.fetchall()}
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='tb' AND table_name='devices'")
              device_columns = {row["column_name"] for row in cur.fetchall()}
              cur.execute("SELECT indexname FROM pg_indexes WHERE schemaname='tb' AND tablename='devices'")
              device_indexes = {row["indexname"] for row in cur.fetchall()}
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='tb' AND table_name='defects'")
              defect_columns = {row["column_name"] for row in cur.fetchall()}
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='tb' AND table_name='acceptances'")
              acceptance_columns = {row["column_name"] for row in cur.fetchall()}
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='tb' AND table_name='background_jobs'")
              background_job_columns = {row["column_name"] for row in cur.fetchall()}
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='tb' AND table_name='files'")
              file_columns = {row["column_name"] for row in cur.fetchall()}
              cur.execute("""
                  SELECT pg_get_constraintdef(c.oid) AS definition
                  FROM pg_constraint c
                  JOIN pg_namespace n ON n.oid = c.connamespace
                  WHERE n.nspname = 'tb'
                    AND c.conname = 'defects_status_check'
              """)
              defect_status_constraint = cur.fetchone()["definition"]
          missing = sorted(required - tables)
          assert not missing, missing
          assert {"auth_token_hash", "auth_token_hint"} <= device_columns, device_columns
          assert "devices_one_active_per_user_uq" in device_indexes, device_indexes
          assert "devices_auth_token_hash_uq" in device_indexes, device_indexes
          assert "area_scope" in defect_columns, defect_columns
          assert "area_scope" in acceptance_columns, acceptance_columns
          assert "result" in acceptance_columns, acceptance_columns
          assert {"progress_percent", "progress_text"} <= background_job_columns, background_job_columns
          assert "photo_metadata" in file_columns, file_columns
          assert "REJECTED" in defect_status_constraint, defect_status_constraint
          print("OK: core tables/migrations", len(tables))
          PY

      - name: Generate ephemeral bootstrap credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("TB_BOOTSTRAP_ADMIN_LOGIN=ci-admin\n")
              out.write("TB_BOOTSTRAP_ADMIN_PASSWORD=" + secrets.token_urlsafe(24) + "Aa1\n")
              out.write("TB_BOOTSTRAP_ADMIN_NAME=CI Administrator\n")
          PY

      - name: Bootstrap initial admin
        working-directory: server
        run: python -m tbserver.bootstrap create-admin

      - name: Start API and verify health/capabilities/auth
        working-directory: server
        run: |
          uvicorn tbserver.main:app --host 127.0.0.1 --port 8080 >/tmp/tbserver-v1.log 2>&1 &
          echo $! >/tmp/tbserver-v1.pid
          python - <<'PY'
          import json
          import time
          import urllib.request

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:8080" + path, timeout=2) as response:
                  return response.status, json.loads(response.read().decode("utf-8"))

          for _ in range(30):
              try:
                  status, live = get("/health/live")
                  if status == 200:
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("API did not become ready")

          status, ready = get("/health/ready")
          assert status == 200, ready
          assert ready["migrations"] == "ok", ready

          status, caps = get("/api/v1/capabilities")
          assert status == 200, caps
          expected_true = {
              "server_1_0_foundation_v1",
              "portal_v1",
              "company_user_admin_v1",
              "device_activation_v1",
              "device_bearer_auth_v1",
              "device_fach_api_v1",
              "release_catalog_v1",
              "release_binary_v1",
              "client_compatibility_v1",
              "worksite_tree_v1",
              "worksite_provisioning_v1",
              "worksite_delete_v1",
              "worksite_permissions_v1",
              "worksite_area_scope_v1",
              "worksite_teams_v1",
              "btb_entries_v1",
              "btb_finalize_with_pdf_v1",
              "btb_participant_shift_end_v1",
              "btb_general_work_entries_v1",
              "btb_photo_metadata_v1",
              "btb_pdf_team_lead_only_v1",
              "company_profile_v1",
              "company_logo_v1",
              "company_pdf_logo_layout_v1",
              "company_branding_admin_ui_v1",
              "portal_worksite_fach_ui_v1",
              "worksite_invitations_v1",
              "worksite_invitation_qr_v1",
              "worksite_team_transfer_v1",
              "admin_system_status_v1",
              "system_automation_v1",
              "system_email_reports_v1",
              "user_profile_v1",
              "user_directory_v1",
              "global_catalog_v1",
              "catalog_history_v1",
              "catalog_no_global_delete_v1",
              "background_jobs_v1",
              "backup_v1",
              "backup_retention_v1",
              "restore_test_v1",
              "test_data_reset_v1",
              "restore_target_v1",
              "btb_live_sync_v1",
              "files_v1",
              "worksite_media_v1",
              "file_cursor_pagination_v1",
              "file_image_renditions_v1",
              "chunk_upload_v1",
              "defects_v1",
              "acceptances_v1",
              "acceptance_result_v1",
              "acceptance_delete_v1",
              "track_data_v1",
              "survey_originals_v1",
              "survey_parser_catalog_v1",
              "survey_section_calibration_v1",
              "survey_projection_v1",
              "survey_station_merge_v1",
              "survey_gra_jump_detection_v1",
              "idempotent_mutations_v1",
              "sync_change_feed_v1",
              "sync_change_wait_v1",
              "admin_portal_session_split_v1",
          }
          missing = sorted(key for key in expected_true if caps["capabilities"].get(key) is not True)
          assert not missing, {"missing_capabilities": missing, "caps": caps}
          print("OK: API foundation/capabilities")
          PY
          cd ..
          python server/checks/22_verify_tb_server_1_auth_runtime.py

      - name: API log on failure
        if: failure()
        run: cat /tmp/tbserver-v1.log || true

  server-gate:
    name: Snapshot, rights and 255-client HTTP gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: tb_gate_http
          POSTGRES_USER: tb_gate
          POSTGRES_PASSWORD: ci-only-gate-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tb_gate -d tb_gate_http"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the existing server image with PostgreSQL 17 clients
        run: docker build -t tb-server-gate -f server/Dockerfile.v1 server
      - name: Run local regressions, real snapshot restore and HTTP gates
        run: |
          docker run --rm --network host \
            -e CI=true -e TB_ENVIRONMENT=test \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_NAME=tb_gate_http \
            -e DB_USER=tb_gate -e DB_PASSWORD=ci-only-gate-password \
            -e STORAGE_ROOT=/tmp/tb-gate-storage -e TB_BACKUP_ROOT=/tmp/tb-gate-backups \
            -e TB_GATE_SOURCE_DSN="host=127.0.0.1 dbname=tb_gate_source user=tb_gate password=ci-only-gate-password" \
            -e TB_GATE_TARGET_DSN="host=127.0.0.1 dbname=tb_gate_target user=tb_gate password=ci-only-gate-password" \
            -v "$GITHUB_WORKSPACE/server:/app" tb-server-gate sh -ec '
              python -m compileall -q tbserver tools
              for check in checks/13[0-9]_*.py; do python "$check"; done
              python checks/140_verify_recovery_guard.py
              python checks/141_verify_recovery_modes.py
              python -m tbserver.migrations up
              python -c "from tbserver.database import connect; c=connect(autocommit=True); c.execute(\"CREATE DATABASE tb_gate_source\"); c.execute(\"CREATE DATABASE tb_gate_target\"); c.close()"
              python tools/backup_snapshot_gate.py --confirm-isolated tb_gate_source:tb_gate_target
              python tools/server_http_gate.py
              python -c "from tbserver.database import connect; c=connect(autocommit=True); c.execute(\"CREATE DATABASE tb_gate_recovery\"); c.execute(\"CREATE DATABASE tb_gate_recovery_target\"); c.close()"
              DB_NAME=tb_gate_recovery STORAGE_ROOT=/tmp/tb-recovery-source TB_BACKUP_ROOT=/tmp/tb-recovery-backups \
              TB_ALLOW_RESTORE_TARGET=YES TB_RESTORE_TARGET_DB_HOST=127.0.0.1 \
              TB_RESTORE_TARGET_DB_NAME=tb_gate_recovery_target TB_RESTORE_TARGET_DB_USER=tb_gate \
              TB_RESTORE_TARGET_DB_PASSWORD=ci-only-gate-password TB_RESTORE_TARGET_STORAGE_ROOT=/tmp/tb-recovery-target \
              python tools/recovery_gate.py
              python -c "from tbserver.database import connect; c=connect(autocommit=True); c.execute(\"DROP DATABASE tb_gate_recovery WITH (FORCE)\"); c.execute(\"DROP DATABASE tb_gate_recovery_target WITH (FORCE)\"); c.execute(\"CREATE DATABASE tb_gate_recovery\"); c.execute(\"CREATE DATABASE tb_gate_recovery_target\"); c.close()"
              DB_NAME=tb_gate_recovery STORAGE_ROOT=/tmp/tb-security-source TB_BACKUP_ROOT=/tmp/tb-security-backups \
              TB_ALLOW_RESTORE_TARGET=YES TB_RESTORE_TARGET_DB_HOST=127.0.0.1 \
              TB_RESTORE_TARGET_DB_NAME=tb_gate_recovery_target TB_RESTORE_TARGET_DB_USER=tb_gate \
              TB_RESTORE_TARGET_DB_PASSWORD=ci-only-gate-password TB_RESTORE_TARGET_STORAGE_ROOT=/tmp/tb-security-target \
              TB_GATE_RECOVERY_MODE=SECURITY python tools/recovery_gate.py
            '

