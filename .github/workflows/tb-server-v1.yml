name: TB-Server 1.0

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/tb-server-v1.yml"
  push:
    branches:
      - "feature/tb-server-1.0"
    paths:
      - "server/**"
      - ".github/workflows/tb-server-v1.yml"

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: tb_helfer_v1
          POSTGRES_USER: tb_helfer
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tb_helfer -d tb_helfer_v1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: tb_helfer_v1
      DB_USER: tb_helfer
      DB_PASSWORD: testpass
      STORAGE_ROOT: /tmp/tb-storage-v1
      TB_MIGRATIONS_ROOT: ${{ github.workspace }}/server/v1_migrations
      TB_ENVIRONMENT: test
      TB_BACKUP_ROOT: /tmp/tb-backups-v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install server dependencies
        working-directory: server
        run: pip install -r requirements.txt

      - name: Foundation source checks
        run: |
          python server/checks/20_verify_tb_server_1_foundation.py
          python server/checks/21_verify_tb_server_1_auth_source.py
          python server/checks/23_verify_tb_server_1_files_source.py
          python server/checks/24_verify_tb_server_1_defects_acceptances_source.py
          python server/checks/25_verify_tb_server_1_track_survey_source.py
          python server/checks/26_verify_tb_server_1_idempotency_source.py
          python server/checks/27_verify_tb_server_1_replay_coverage_source.py
          python server/checks/28_verify_tb_server_1_device_auth_source.py
          python server/checks/29_verify_tb_server_1_device_fach_auth_source.py
          python server/checks/30_verify_tb_server_1_survey_parser_source.py
          python server/checks/31_verify_tb_server_1_survey_sections_source.py
          python server/checks/32_verify_tb_server_1_survey_projection_source.py
          python server/checks/33_verify_tb_server_1_releases_source.py
          python server/checks/34_verify_tb_server_1_btb_pdf_source.py
          python server/checks/35_verify_tb_server_1_company_branding_source.py
          python server/checks/36_verify_tb_server_1_admin_web_source.py
          python server/checks/37_verify_tb_server_1_portal_fach_ui_source.py
          python server/checks/38_verify_tb_server_1_worksite_invitations_source.py
          python server/checks/39_verify_tb_server_1_system_status_source.py
          python server/checks/40_verify_tb_server_1_release_binary_source.py
          python server/checks/41_verify_tb_server_1_backup_jobs_source.py
          python server/checks/42_verify_tb_server_1_restore_test_reset_source.py
          python server/checks/43_verify_tb_server_1_restore_target_source.py
          python server/checks/44_verify_tb_server_1_deployment_source.py
          python server/checks/45_verify_tb_server_1_backup_retention_source.py
          python server/checks/46_verify_tb_server_1_invitation_only_membership_source.py
          python server/checks/47_verify_tb_server_1_invitation_qr_source.py
          python server/checks/48_verify_android_server_1_invitation_source.py
          python server/checks/49_verify_tb_server_1_restore_compose_overlay_source.py
          python server/checks/50_verify_android_server_1_invitation_create_source.py
          python server/checks/51_verify_android_server_1_team_source.py
          python server/checks/52_verify_android_server_1_capabilities_source.py
          python server/checks/53_verify_android_server_1_context_source.py
          python server/checks/54_verify_tb_server_1_area_scope_source.py
          python server/checks/55_verify_tb_server_1_file_parent_visibility_source.py
          python server/checks/56_verify_tb_server_1_acceptance_result_source.py
          python server/checks/57_verify_android_server_1_fach_read_sync_source.py
          python server/checks/58_verify_android_server_1_fach_write_sync_source.py
          python server/checks/59_verify_android_server_1_file_read_sync_source.py
          python server/checks/60_verify_android_server_1_file_upload_source.py
          python server/checks/61_verify_android_server_1_file_snapshot_cleanup_source.py
          python server/checks/62_verify_android_server_1_file_truncation_guard_source.py
          python server/checks/63_verify_android_server_1_btb_read_sync_source.py
          python server/checks/64_verify_android_server_1_btb_write_sync_source.py
          python server/checks/65_verify_android_server_1_btb_granularity_source.py
          python server/checks/66_verify_android_server_1_btb_media_source.py
          python server/checks/67_verify_android_server_1_btb_final_pdf_source.py
          python server/checks/68_verify_android_server_1_btb_delete_source.py
          python server/checks/69_verify_android_server_1_shared_sync_source.py
          python server/checks/70_verify_tb_server_1_file_pagination_source.py
          python server/checks/71_verify_server_1_worksite_tree_sync_source.py
          python server/checks/72_verify_android_server_1_track_data_source.py
          python server/checks/73_verify_server_1_worksite_lifecycle_source.py
          python server/checks/74_verify_server_1_worksite_media_source.py
          python server/checks/75_verify_portal_worksite_tree_model_source.py
          python server/checks/76_verify_portal_fach_forms_source.py
          python server/checks/77_verify_portal_fach_media_source.py
          python server/checks/78_verify_defect_rejected_status_source.py
          python server/checks/79_verify_acceptance_delete_sync_source.py
          python server/checks/80_verify_acceptance_tombstone_apply_source.py
          python server/checks/81_verify_portal_acceptance_delete_source.py
          python server/checks/82_verify_tb_server_1_synology_staging_source.py
          python server/checks/83_verify_android_staging_server_config_source.py
          python server/checks/84_verify_device_activation_qr_source.py
          python server/checks/85_verify_tb_server_1_user_delete_source.py
          python server/checks/86_verify_tb_server_1_admin_overview_source.py
          python server/checks/87_verify_release_admin_package_ui.py
          python server/checks/88_verify_admin_permanent_purge_source.py
          python server/checks/89_verify_identity_global_catalog_source.py
          python server/checks/90_verify_system_automation_email_source.py
          python server/checks/91_verify_system_status_live_ui_source.py
          python server/checks/92_verify_btb_shift_end_source.py
          python server/checks/93_verify_portal_btb_shift_end_source.py
          python server/checks/94_verify_portal_btb_readable_source.py
          python server/checks/95_verify_portal_btb_android_like_editor_source.py
          python server/checks/96_verify_portal_btb_crud_source.py

      # Migration 014_btb_participant_shift_status.sql is included by the normal migration runner.
      - name: Apply fresh TB-Server 1.0 baseline
        working-directory: server
        run: python -m tbserver.migrations up

      - name: Verify migration status
        working-directory: server
        run: |
          python -m tbserver.migrations status
          python - <<'PY'
          from tbserver.migrations import status
          current = status()
          assert current["latest_known"] == 14, current
          assert current["latest_applied"] == 14, current
          assert current["pending"] == [], current
          print("OK: migration status", current)
          PY

      - name: Verify core tables and migrations
        working-directory: server
        run: |
          python - <<'PY'
          from tbserver.database import connect
          required = {
              "companies", "users", "devices", "worksites", "worksite_nodes",
              "worksite_memberships", "teams", "btbs", "btb_entries", "files",
              "file_links", "upload_sessions", "defects", "acceptances",
              "survey_originals", "survey_parse_catalog", "track_data",
              "track_data_sources", "track_data_km_points", "mutation_receipts",
              "change_feed", "audit_log", "releases", "backup_runs",
              "system_metrics_hourly", "catalog_routes", "catalog_stations",
              "catalog_sections", "catalog_objects", "catalog_history",
              "system_schedule_runs", "btb_participant_states",
          }
          with connect() as conn, conn.cursor() as cur:
              cur.execute("SELECT tablename FROM pg_tables WHERE schemaname='tb'")
              tables = {row["tablename"] for row in cur.fetchall()}
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='tb' AND table_name='devices'")
              device_columns = {row["column_name"] for row in cur.fetchall()}
              cur.execute("SELECT indexname FROM pg_indexes WHERE schemaname='tb' AND tablename='devices'")
              device_indexes = {row["indexname"] for row in cur.fetchall()}
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='tb' AND table_name='defects'")
              defect_columns = {row["column_name"] for row in cur.fetchall()}
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='tb' AND table_name='acceptances'")
              acceptance_columns = {row["column_name"] for row in cur.fetchall()}
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='tb' AND table_name='background_jobs'")
              background_job_columns = {row["column_name"] for row in cur.fetchall()}
              cur.execute("""
                  SELECT pg_get_constraintdef(c.oid) AS definition
                  FROM pg_constraint c
                  JOIN pg_namespace n ON n.oid = c.connamespace
                  WHERE n.nspname = 'tb'
                    AND c.conname = 'defects_status_check'
              """)
              defect_status_constraint = cur.fetchone()["definition"]
          missing = sorted(required - tables)
          assert not missing, missing
          assert {"auth_token_hash", "auth_token_hint"} <= device_columns, device_columns
          assert "devices_one_active_per_user_uq" in device_indexes, device_indexes
          assert "devices_auth_token_hash_uq" in device_indexes, device_indexes
          assert "area_scope" in defect_columns, defect_columns
          assert "area_scope" in acceptance_columns, acceptance_columns
          assert "result" in acceptance_columns, acceptance_columns
          assert {"progress_percent", "progress_text"} <= background_job_columns, background_job_columns
          assert "REJECTED" in defect_status_constraint, defect_status_constraint
          print("OK: core tables/migrations", len(tables))
          PY

      - name: Generate ephemeral bootstrap credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("TB_BOOTSTRAP_ADMIN_LOGIN=ci-admin\n")
              out.write("TB_BOOTSTRAP_ADMIN_PASSWORD=" + secrets.token_urlsafe(24) + "Aa1\n")
              out.write("TB_BOOTSTRAP_ADMIN_NAME=CI Administrator\n")
          PY

      - name: Bootstrap initial admin
        working-directory: server
        run: python -m tbserver.bootstrap create-admin

      - name: Start API and verify health/capabilities/auth
        working-directory: server
        run: |
          uvicorn tbserver.main:app --host 127.0.0.1 --port 8080 >/tmp/tbserver-v1.log 2>&1 &
          echo $! >/tmp/tbserver-v1.pid
          python - <<'PY'
          import json
          import time
          import urllib.request

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:8080" + path, timeout=2) as response:
                  return response.status, json.loads(response.read().decode("utf-8"))

          for _ in range(30):
              try:
                  status, live = get("/health/live")
                  if status == 200:
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("API did not become ready")

          status, ready = get("/health/ready")
          assert status == 200, ready
          assert ready["migrations"] == "ok", ready

          status, caps = get("/api/v1/capabilities")
          assert status == 200, caps
          expected_true = {
              "server_1_0_foundation_v1",
              "portal_v1",
              "company_user_admin_v1",
              "device_activation_v1",
              "device_bearer_auth_v1",
              "device_fach_api_v1",
              "release_catalog_v1",
              "release_binary_v1",
              "client_compatibility_v1",
              "worksite_tree_v1",
              "worksite_provisioning_v1",
              "worksite_delete_v1",
              "worksite_permissions_v1",
              "worksite_area_scope_v1",
              "worksite_teams_v1",
              "btb_entries_v1",
              "btb_finalize_with_pdf_v1",
              "btb_participant_shift_end_v1",
              "btb_pdf_team_lead_only_v1",
              "company_profile_v1",
              "company_logo_v1",
              "company_pdf_logo_layout_v1",
              "company_branding_admin_ui_v1",
              "portal_worksite_fach_ui_v1",
              "worksite_invitations_v1",
              "worksite_invitation_qr_v1",
              "worksite_team_transfer_v1",
              "admin_system_status_v1",
              "system_automation_v1",
              "system_email_reports_v1",
              "user_profile_v1",
              "user_directory_v1",
              "global_catalog_v1",
              "catalog_history_v1",
              "catalog_no_global_delete_v1",
              "background_jobs_v1",
              "backup_v1",
              "backup_retention_v1",
              "restore_test_v1",
              "test_data_reset_v1",
              "restore_target_v1",
              "btb_live_sync_v1",
              "files_v1",
              "worksite_media_v1",
              "file_cursor_pagination_v1",
              "chunk_upload_v1",
              "defects_v1",
              "acceptances_v1",
              "acceptance_result_v1",
              "acceptance_delete_v1",
              "track_data_v1",
              "survey_originals_v1",
              "survey_parser_catalog_v1",
              "survey_section_calibration_v1",
              "survey_projection_v1",
              "survey_station_merge_v1",
              "survey_gra_jump_detection_v1",
              "idempotent_mutations_v1",
          }
          missing = sorted(key for key in expected_true if caps["capabilities"].get(key) is not True)
          assert not missing, {"missing_capabilities": missing, "caps": caps}
          print("OK: API foundation/capabilities")
          PY
          cd ..
          python server/checks/22_verify_tb_server_1_auth_runtime.py

      - name: API log on failure
        if: failure()
        run: cat /tmp/tbserver-v1.log || true
