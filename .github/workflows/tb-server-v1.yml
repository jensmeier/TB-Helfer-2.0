name: TB-Server 1.0

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/tb-server-v1.yml"
  push:
    branches:
      - "feature/tb-server-1.0"
    paths:
      - "server/**"
      - ".github/workflows/tb-server-v1.yml"

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: tb_helfer_v1
          POSTGRES_USER: tb_helfer
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tb_helfer -d tb_helfer_v1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: tb_helfer_v1
      DB_USER: tb_helfer
      DB_PASSWORD: testpass
      STORAGE_ROOT: /tmp/tb-storage-v1
      TB_MIGRATIONS_ROOT: ${{ github.workspace }}/server/v1_migrations
      TB_ENVIRONMENT: test
      TB_BACKUP_ROOT: /tmp/tb-backups-v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install server dependencies
        working-directory: server
        run: pip install -r requirements.txt

      - name: Foundation source checks
        run: |
          python server/checks/20_verify_tb_server_1_foundation.py
          python server/checks/21_verify_tb_server_1_auth_source.py
          python server/checks/23_verify_tb_server_1_files_source.py
