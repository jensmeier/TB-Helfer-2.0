name: One-shot Android 200035 source patch

on:
  push:
    branches:
      - feature/admin-offline-sync
    paths:
      - .github/scripts/patch_200035.py
      - .github/workflows/patch-200035.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-offline-sync

      - name: Apply focused PDF photo-diff patch
        run: python3 .github/scripts/patch_200035.py

      - name: Commit patched renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/tbhelfer/ui/bautagebuch/BautagebuchPdf.kt
          git diff --cached --check
          git commit -m "fix: compare BTB photo lines against original"
          git push origin HEAD:feature/admin-offline-sync
