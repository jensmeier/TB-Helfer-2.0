name: Portal 005 integration
on:
  push:
    branches: [feature/tb-server-1.0]
    paths: ['server/tbserver/portal_recovery.py', 'server/tbserver/public_overview.py', 'server/tbserver/btb_participants.py', 'server/tbserver/worksites.py', 'server/templates/**', 'server/v1_migrations/023*', 'server/checks/148*', '.github/workflows/portal-005.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: portal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_NAME: portal_test
      DB_USER: postgres
      DB_PASSWORD: test-only
      TB_PORTAL_PUBLIC_BASE_URL: https://example.invalid
      STORAGE_ROOT: /tmp/portal-storage
      TB_BACKUP_ROOT: /tmp/portal-backup
      PORTAL_TEST_ISOLATED: YES
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt httpx pillow
      - run: python server/checks/148_portal_recovery_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-rendered
          path: /tmp/portal-rendered
