name: tb-helfer-v1

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TB_V1_DB_NAME:-tb_helfer_v1}
      POSTGRES_USER: ${TB_V1_DB_USER:-tb_helfer}
      POSTGRES_PASSWORD: ${TB_V1_DB_PASSWORD:?TB_V1_DB_PASSWORD fehlt}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${TB_V1_DB_DATA_DIR:-./database-v1}:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.v1
    image: tb-helfer-server-v1:local
    restart: "on-failure:5"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${TB_V1_DB_NAME:-tb_helfer_v1}
      DB_USER: ${TB_V1_DB_USER:-tb_helfer}
      DB_PASSWORD: ${TB_V1_DB_PASSWORD:?TB_V1_DB_PASSWORD fehlt}
      STORAGE_ROOT: /tb/storage-v1
      TB_BACKUP_ROOT: /tb/backups-v1
      TB_MIGRATIONS_ROOT: /app/v1_migrations
      TB_ENVIRONMENT: ${TB_V1_ENVIRONMENT:-staging}
      TZ: ${TZ:-Europe/Berlin}
    command: ["python", "-m", "tbserver.migrations", "up"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.v1
    image: tb-helfer-server-v1:local
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${TB_V1_DB_NAME:-tb_helfer_v1}
      DB_USER: ${TB_V1_DB_USER:-tb_helfer}
      DB_PASSWORD: ${TB_V1_DB_PASSWORD:?TB_V1_DB_PASSWORD fehlt}
      STORAGE_ROOT: /tb/storage-v1
      TB_BACKUP_ROOT: /tb/backups-v1
      TB_MIGRATIONS_ROOT: /app/v1_migrations
      TB_ENVIRONMENT: ${TB_V1_ENVIRONMENT:-staging}
      TB_PUBLIC_BASE_URL: ${TB_V1_PUBLIC_BASE_URL:-}
      TB_PORTAL_SESSION_HOURS: ${TB_V1_PORTAL_SESSION_HOURS:-12}
      LOG_LEVEL: ${TB_V1_LOG_LEVEL:-INFO}
      TB_BACKUP_RETENTION_DAYS: ${TB_V1_BACKUP_RETENTION_DAYS:-30}
      TB_BACKUP_RETENTION_MIN_PER_KIND: ${TB_V1_BACKUP_RETENTION_MIN_PER_KIND:-3}
      TB_SMTP_HOST: ${TB_V1_SMTP_HOST:-}
      TB_SMTP_PORT: ${TB_V1_SMTP_PORT:-587}
      TB_SMTP_USER: ${TB_V1_SMTP_USER:-}
      TB_SMTP_PASSWORD: ${TB_V1_SMTP_PASSWORD:-}
      TB_SMTP_SENDER: ${TB_V1_SMTP_SENDER:-}
      TB_SMTP_STARTTLS: ${TB_V1_SMTP_STARTTLS:-true}
      TB_SMTP_SSL: ${TB_V1_SMTP_SSL:-false}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${TB_V1_STORAGE_DIR:-./storage-v1}:/tb/storage-v1
      - ${TB_V1_BACKUP_DIR:-./backups-v1}:/tb/backups-v1
    ports:
      - "${TB_V1_API_BIND:-127.0.0.1}:${TB_V1_API_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/health/ready
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.v1
    image: tb-helfer-server-v1:local
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${TB_V1_DB_NAME:-tb_helfer_v1}
      DB_USER: ${TB_V1_DB_USER:-tb_helfer}
      DB_PASSWORD: ${TB_V1_DB_PASSWORD:?TB_V1_DB_PASSWORD fehlt}
      STORAGE_ROOT: /tb/storage-v1
      TB_BACKUP_ROOT: /tb/backups-v1
      TB_MIGRATIONS_ROOT: /app/v1_migrations
      TB_ENVIRONMENT: ${TB_V1_ENVIRONMENT:-staging}
      LOG_LEVEL: ${TB_V1_LOG_LEVEL:-INFO}
      TB_BACKUP_RETENTION_DAYS: ${TB_V1_BACKUP_RETENTION_DAYS:-30}
      TB_BACKUP_RETENTION_MIN_PER_KIND: ${TB_V1_BACKUP_RETENTION_MIN_PER_KIND:-3}
      TB_SMTP_HOST: ${TB_V1_SMTP_HOST:-}
      TB_SMTP_PORT: ${TB_V1_SMTP_PORT:-587}
      TB_SMTP_USER: ${TB_V1_SMTP_USER:-}
      TB_SMTP_PASSWORD: ${TB_V1_SMTP_PASSWORD:-}
      TB_SMTP_SENDER: ${TB_V1_SMTP_SENDER:-}
      TB_SMTP_STARTTLS: ${TB_V1_SMTP_STARTTLS:-true}
      TB_SMTP_SSL: ${TB_V1_SMTP_SSL:-false}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${TB_V1_STORAGE_DIR:-./storage-v1}:/tb/storage-v1
      - ${TB_V1_BACKUP_DIR:-./backups-v1}:/tb/backups-v1
    command: ["python", "-m", "tbserver.jobs", "worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
