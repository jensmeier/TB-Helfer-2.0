<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TB-Helfer · Portal aktivieren</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2939;background:#f6f8fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}
    .card{width:min(560px,100%);background:white;border:1px solid #e4e7ec;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(16,24,40,.08)}
    h1{margin:0 0 6px}.muted{color:#667085;margin-top:0}label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
    input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}
    button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:9px;background:#1167d8;color:white;font:inherit;font-weight:750;cursor:pointer}
    button:disabled{opacity:.55}.msg{margin-top:14px;padding:10px;border-radius:9px;display:none}.err{background:#fef3f2;color:#b42318}.ok{background:#ecfdf3;color:#067647}
  </style>
</head>
<body>
  <div class="card">
    <h1>Portal erstmals aktivieren</h1>
    <p class="muted">Hier legst du deinen eigenen eindeutigen Login, Anzeigenamen und dein Passwort fest. E-Mail und Telefon sind persönliche Kontaktdaten und können später weiter geändert werden.</p>
    <form id="activateForm">
      <label for="login">Eigener Login</label>
      <input id="login" minlength="3" maxlength="120" autocomplete="username" required>
      <label for="displayName">Anzeigename</label>
      <input id="displayName" maxlength="200" required>
      <label for="email">Persönliche E-Mail</label>
      <input id="email" type="email" maxlength="320" autocomplete="email">
      <label for="phone">Persönliches Telefon</label>
      <input id="phone" maxlength="100" autocomplete="tel">
      <label for="password">Neues Passwort</label>
      <input id="password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required>
      <label for="password2">Passwort wiederholen</label>
      <input id="password2" type="password" minlength="12" maxlength="200" autocomplete="new-password" required>
      <button id="submit" type="submit">Portal aktivieren</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
<script>
const params=new URLSearchParams(location.search);
const token=params.get('token')||'';
const provisional=params.get('login')||'';
if(provisional)document.getElementById('login').value=provisional;
const form=document.getElementById('activateForm'),button=document.getElementById('submit'),msg=document.getElementById('msg');
if(!token){msg.textContent='Aktivierungslink ist unvollständig.';msg.className='msg err';msg.style.display='block';button.disabled=true;}
form.addEventListener('submit',async ev=>{
  ev.preventDefault();msg.style.display='none';
  const password=document.getElementById('password').value;
  if(password!==document.getElementById('password2').value){
    msg.textContent='Die Passwörter stimmen nicht überein.';msg.className='msg err';msg.style.display='block';return;
  }
  button.disabled=true;
  try{
    const response=await fetch('/api/v1/portal/activate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        token,
        login_name:document.getElementById('login').value.trim(),
        display_name:document.getElementById('displayName').value.trim(),
        personal_email:document.getElementById('email').value.trim()||null,
        personal_phone:document.getElementById('phone').value.trim()||null,
        password
      })
    });
    const text=await response.text();let data={};try{data=text?JSON.parse(text):{};}catch(_){}
    if(!response.ok)throw new Error((data&&data.detail)||'Aktivierung fehlgeschlagen.');
    msg.textContent='Portal wurde aktiviert. Du kannst dich jetzt anmelden.';msg.className='msg ok';msg.style.display='block';
    setTimeout(()=>location.href='/portal/v1/login',700);
  }catch(error){msg.textContent=error.message||String(error);msg.className='msg err';msg.style.display='block';button.disabled=false;}
});
</script>
</body>
</html>
