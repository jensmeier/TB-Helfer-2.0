<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or "TB-Helfer Administration" }}</title><style>
body{font-family:system-ui;margin:0;background:#f4f6f8;color:#18202a}.top{background:#1167d8;color:#fff;padding:14px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}.top a{color:#fff;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi{font-size:28px;font-weight:700}.btn,button{background:#1167d8;color:#fff;border:0;border-radius:8px;padding:10px 14px;text-decoration:none;cursor:pointer;display:inline-block}.btn.secondary,button.secondary{background:#667085}.btn.danger,button.danger{background:#b42318}.btn.small,button.small{padding:7px 10px;font-size:14px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 14px;border:1px solid #ccd4de;border-radius:8px;font-size:16px;background:#fff}textarea{min-height:100px;font-family:inherit}input[type=checkbox]{width:auto;margin:0 8px 0 0}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:8px 0 16px}.check{display:flex;align-items:center;padding:10px;border:1px solid #e6e9ee;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e6e9ee;text-align:left;vertical-align:top}.scroll{overflow-x:auto}.error{background:#fff0f0;color:#a40000;padding:10px;border-radius:8px;margin-bottom:14px}.notice{background:#ecfdf3;color:#067647;padding:10px;border-radius:8px;margin-bottom:14px}.muted{color:#667085}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions form{margin:0}.badge{display:inline-block;border-radius:999px;background:#eef2f6;padding:3px 8px;font-size:13px}.danger-zone{border-color:#f3b6b2;background:#fffafa}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
