<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>TB-Helfer · Zugang wiederherstellen</title><style>body{font:16px/1.5 system-ui;background:#f5f7fb;color:#142039;margin:0;padding:24px}.card{max-width:440px;margin:8vh auto;background:white;border:1px solid #dde3eb;border-radius:16px;padding:28px}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:8px;border:1px solid #ccd3df}button{background:#1261d0;color:white;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}a{color:#1261d0}#msg{white-space:pre-wrap}</style></head><body><main class="card"><h1 id="title">Passwort vergessen?</h1><p id="intro">Gib deinen Benutzernamen oder deine bestätigte E-Mail-Adresse ein.</p><form id="form"><label id="label" for="value">Benutzername oder E-Mail</label><input id="value" required autocomplete="username" maxlength="320"><button id="submit">Link anfordern</button></form><p id="msg" role="status"></p><p>Keine bestätigte E-Mail hinterlegt? Wende dich an deinen Administrator.</p><a href="/portal/v1/login">Zur Anmeldung</a></main><script>
const fragment=new URLSearchParams(location.hash.slice(1));const token=fragment.get('reset')||fragment.get('verify');const mode=fragment.has('reset')?'reset':fragment.has('verify')?'verify':'forgot';history.replaceState(null,'',location.pathname);
const input=document.getElementById('value'),form=document.getElementById('form'),button=document.getElementById('submit'),msg=document.getElementById('msg');
if(mode==='reset'){document.getElementById('title').textContent='Neues Passwort';document.getElementById('intro').textContent='Mindestens 12 Zeichen. Verwende ein eigenes, langes Passwort.';document.getElementById('label').textContent='Neues Passwort';input.type='password';input.minLength=12;input.maxLength=200;input.autocomplete='new-password';button.textContent='Passwort speichern';}
if(mode==='verify'){document.getElementById('title').textContent='E-Mail bestätigen';document.getElementById('intro').textContent='Bestätige, dass diese E-Mail-Adresse dir gehört.';input.hidden=true;input.required=false;document.getElementById('label').hidden=true;button.textContent='E-Mail bestätigen';}
form.onsubmit=async e=>{e.preventDefault();button.disabled=true;try{const endpoint=mode==='verify'?'email/verify':'password/'+mode;const body=mode==='forgot'?{login:input.value}:mode==='verify'?{token}:{token,password:input.value};const r=await fetch('/api/v1/portal/'+endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.detail==='LINK_INVALID_OR_EXPIRED'?'Dieser Link ist ungültig oder abgelaufen. Bitte einen neuen Link anfordern.':r.status===503?'Die Wiederherstellung ist noch nicht eingerichtet. Bitte den Administrator kontaktieren.':'Die Anfrage konnte nicht abgeschlossen werden. Bitte Eingabe prüfen und erneut versuchen.');msg.textContent=data.message;form.hidden=true;}catch(err){msg.textContent=err.message;}finally{button.disabled=false;}};
</script></body></html>
