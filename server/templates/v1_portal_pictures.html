{% extends "v1_base.html" %}{% block title %}TB-Helfer · Bilderübersicht{% endblock %}{% block head %}<style>.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.photo{margin:0;background:white;border:1px solid #e4e7ec;border-radius:12px;overflow:hidden}.photo img{width:100%;height:180px;object-fit:cover}.photo figcaption{padding:12px;overflow-wrap:anywhere}</style>{% endblock %}{% block content %}
<div class="card"><h1>Bilderübersicht</h1><p class="muted">Alle für dich freigegebenen Bilder der ausgewählten Baustelle.</p><div class="grid"><div><label for="site">Baustelle</label><select id="site"><option value="">Bitte wählen …</option></select></div><div><label for="date">Aufnahmedatum</label><input id="date" type="date"></div><div><label for="kind">Bereich</label><select id="kind"><option value="">Alle</option><option value="BTB">Bautagesberichte</option><option value="DEFECT">Mängel</option><option value="ACCEPTANCE">Abnahmen</option></select></div><div><label for="search">Suche</label><input id="search" type="search" placeholder="Name, Aufnahmequelle, Bericht …"></div></div><p id="notice" role="status"></p></div><div id="gallery" class="gallery"></div>
{% endblock %}{% block scripts %}<script>
const site=document.getElementById('site'),notice=document.getElementById('notice'),gallery=document.getElementById('gallery');let media=[],generation=0;
function render(){gallery.replaceChildren();const seen=new Set(),date=document.getElementById('date').value,kind=document.getElementById('kind').value,term=document.getElementById('search').value.toLocaleLowerCase();const selected=media.filter(m=>{if(!m.renditions?.thumb||seen.has(m.attachment_id))return false;if(date&&!String(m.captured_at||m.created_at).startsWith(date))return false;if(kind&&m.entity_type!==kind)return false;if(term&&!JSON.stringify([m.filename,m.source,m.uploaded_by_name,m.photo_metadata,m.parent_entity_id]).toLocaleLowerCase().includes(term))return false;seen.add(m.attachment_id);return true;});selected.forEach(m=>{const figure=document.createElement('figure');figure.className='photo';const link=document.createElement('a');link.href=tbScopedUrl(m.renditions.preview);link.target='_blank';link.rel='noopener';const img=document.createElement('img');img.src=tbScopedUrl(m.renditions.thumb);img.loading='lazy';img.alt=m.photo_metadata?.short_text||m.filename||'Baustellenfoto';link.append(img);const caption=document.createElement('figcaption');caption.textContent=[m.photo_metadata?.short_text||m.filename,m.captured_at?new Date(m.captured_at).toLocaleString('de-DE'):'',m.source].filter(Boolean).join(' · ');figure.append(link,caption);gallery.append(figure);});notice.textContent=selected.length+' Bilder';}
async function load(){const turn=++generation;media=[];gallery.replaceChildren();if(!site.value){notice.textContent='Bitte eine Baustelle auswählen.';return;}notice.textContent='Bilder werden geladen …';try{const r=await tbApi('/api/v1/worksites/'+encodeURIComponent(site.value)+'/media');if(turn!==generation)return;media=r.data.media||[];render();}catch(e){if(turn!==generation)return;notice.textContent=String(e.message).includes('files.view')?'Für diese Baustelle fehlt dir die Berechtigung zum Anzeigen von Bildern.':'Bilder konnten nicht geladen werden. Bitte erneut versuchen.';}}
site.onchange=load;['date','kind','search'].forEach(id=>document.getElementById(id).oninput=render);
(async()=>{try{const r=await tbApi('/api/v1/worksites');(r.data.worksites||[]).forEach(w=>{const o=document.createElement('option');o.value=w.id;o.textContent=w.name;site.append(o);});const chosen=new URLSearchParams(location.search).get('worksite');if(chosen&&Array.from(site.options).some(o=>o.value===chosen)){site.value=chosen;await load();}}catch(e){notice.textContent='Baustellen konnten nicht geladen werden.';}})();
</script>{% endblock %}
