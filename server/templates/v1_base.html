<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}TB-Helfer · Server 1.0{% endblock %}</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2939;background:#f6f8fb}
    *{box-sizing:border-box}body{margin:0}a{color:#1167d8;text-decoration:none}a:hover{text-decoration:underline}
    header{background:#101828;color:white;padding:14px 20px;display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    header a{color:white}.brand{font-weight:800}.nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    main{max-width:1180px;margin:0 auto;padding:22px}.card{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
    h1,h2,h3{margin-top:0}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:9px;background:white;font:inherit}
    input[type=checkbox]{width:auto}.check{display:flex;gap:8px;align-items:center;font-weight:600}.check label{margin:0;font-weight:600}
    button,.btn{display:inline-block;border:0;border-radius:9px;padding:10px 14px;background:#1167d8;color:white;font-weight:700;cursor:pointer;font:inherit}
    button.secondary,.btn.secondary{background:#667085}button.danger{background:#b42318}button:disabled{opacity:.55;cursor:not-allowed}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eaecf0;vertical-align:top}th{font-size:13px;color:#475467}
    .notice{padding:10px 12px;border-radius:9px;margin:10px 0}.notice.ok{background:#ecfdf3;color:#067647}.notice.err{background:#fef3f2;color:#b42318}.notice.info{background:#eff8ff;color:#175cd3}
    .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:#f2f4f7;font-size:12px;font-weight:700}
    code{background:#f2f4f7;border-radius:5px;padding:2px 5px}.right{text-align:right}
    @media(max-width:700px){main{padding:14px}header{padding:12px 14px}.scroll{overflow-x:auto}}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<header>
  <div class="brand">TB-Helfer · Server 1.0</div>
  <div class="nav">
    <a href="/portal/v1">Portal</a>
    {% if user %}<a href="/portal/v1/worksites">Baustellen</a>{% endif %}
    {% if user and user.company_role == 'ADMIN' %}<a href="/admin/v1/companies">Firmen</a>{% endif %}
    {% if user %}<span>{{ user.display_name }}</span><button class="secondary" type="button" onclick="tbLogout()">Abmelden</button>{% endif %}
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
function tbCookie(name){
  const found=document.cookie.split(';').map(v=>v.trim()).find(v=>v.startsWith(name+'='));
  return found?decodeURIComponent(found.substring(name.length+1)):'';
}
async function tbApi(url, options){
  const opts=Object.assign({credentials:'same-origin'}, options||{});
  opts.headers=Object.assign({}, opts.headers||{});
  if((opts.method||'GET').toUpperCase()!=='GET'){
    opts.headers['X-CSRF-Token']=tbCookie('tb_portal_csrf');
    opts.headers['X-Client-Change-Id']=opts.clientChangeId||(
      window.crypto&&crypto.randomUUID?crypto.randomUUID():
      'web-'+Date.now()+'-'+Math.random().toString(16).slice(2)
    );
    delete opts.clientChangeId;
  }
  const response=await fetch(url,opts);
  if(response.status===204) return {response,data:null};
  const text=await response.text();
  let data=null;try{data=text?JSON.parse(text):null;}catch(_){data=text;}
  if(!response.ok){
    const detail=data&&data.detail!==undefined?data.detail:data;
    throw new Error(typeof detail==='string'?detail:JSON.stringify(detail||{status:response.status}));
  }
  return {response,data};
}
async function tbLogout(){
  try{await tbApi('/api/v1/portal/logout',{method:'POST'});}catch(_){}
  location.href='/portal/v1/login';
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
