{% extends "base.html" %}{% block content %}
<h2>{% if mode=="new" %}Strecke anlegen{% else %}Strecke bearbeiten{% endif %}</h2>{% if error %}<div class="error">{{ error }}</div>{% endif %}
<div class="card"><form method="post"><input type="hidden" name="csrf" value="{{ admin.csrf }}">
<label>Streckennummer</label><input name="route_number" required value="{{ route.route_number or '' }}" placeholder="z. B. 5362">
<label>Name</label><input name="name" value="{{ route.name or '' }}" placeholder="optional">
<label>Beschreibung</label><textarea name="description">{{ route.description or '' }}</textarea>
<div class="actions"><button>Speichern</button><a class="btn secondary" href="/admin/routes">Abbrechen</a></div></form></div>{% endblock %}
